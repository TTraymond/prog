<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Progression MCV B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : en-tête fin · colonne séquences | grille des semaines | tiroir de détail. Mobile : un écran à la fois + barre d'onglets en bas. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E3E9E7; --ink:#15201E; --muted:#5A6764; --line:#CFD9D6;
  --accent:#2747C8; --accent-ink:#FFFFFF; --hl:#FFE45C; --hl-soft:#FFF6BF;
  --danger:#C62828; --warn:#B26A00; --ok:#1B7F4B;
  --b1:#2F6FE0; --b2:#14946A; --b3:#D9822B; --b4:#C2338A; --bT:#6B7A8F;
  --c1:#A8580C; --c2:#6A3FD0;
  --hatch:rgba(21,32,30,.07);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --shadow:0 8px 28px rgba(15,25,23,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201E; --surface-2:#212B29; --ink:#E5ECEA; --muted:#93A29F; --line:#2D3936;
  --accent:#8FA3FF; --accent-ink:#0F1514; --hl:#E6CB3A; --hl-soft:#3A3516;
  --danger:#FF7A6E; --warn:#F2B04A; --ok:#5CD39A;
  --b1:#6E9CFF; --b2:#44C495; --b3:#F0A55A; --b4:#F06CB8; --bT:#9AA9BD; --c1:#F0A15A; --c2:#B19BFF;
  --hatch:rgba(229,236,234,.07); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201E; --surface-2:#212B29; --ink:#E5ECEA; --muted:#93A29F; --line:#2D3936;
  --accent:#8FA3FF; --accent-ink:#0F1514; --hl:#E6CB3A; --hl-soft:#3A3516;
  --danger:#FF7A6E; --warn:#F2B04A; --ok:#5CD39A;
  --b1:#6E9CFF; --b2:#44C495; --b3:#F0A55A; --b4:#F06CB8; --bT:#9AA9BD; --c1:#F0A15A; --c2:#B19BFF;
  --hatch:rgba(229,236,234,.07); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86em}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.78rem}
.sync{font-size:.75rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync[data-s="ok"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.sync[data-s="busy"]{color:var(--warn)}
.sync[data-s="err"]{color:var(--danger)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.ibtn:hover{background:var(--surface-2)}
.ibtn:disabled{opacity:.4;cursor:default}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:.82rem}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0;position:relative}
.layout.drawer-open{grid-template-columns:300px minmax(0,1fr) 420px}
.pane{min-height:0;overflow:auto}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.side-head h2{margin:0;font-family:var(--f-display);font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline}
.side-list{overflow:auto;padding:10px 12px 90px;display:flex;flex-direction:column;gap:8px;flex:1}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button+button{border-left:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 9px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;cursor:grab;user-select:none;-webkit-user-select:none;position:relative;touch-action:pan-y}
.card:hover{border-color:color-mix(in srgb,var(--b) 60%,var(--line))}
.card.sel{outline:2px solid var(--accent);outline-offset:1px}
.card .t{font-weight:700;font-size:.92rem;line-height:1.25;min-width:0}
.card .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--b) 16%,var(--surface));color:color-mix(in srgb,var(--b) 80%,var(--ink));letter-spacing:.02em}
.cls{font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid currentColor}
.lvl{letter-spacing:1px;color:var(--b);font-size:.7rem}
.prog{height:4px;border-radius:3px;background:var(--surface-2);grid-column:1/-1;overflow:hidden}
.prog i{display:block;height:100%;background:var(--b)}
.hours{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.status{font-size:.7rem;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.status[data-s="ready"]{color:var(--accent)}
.status[data-s="doing"]{color:var(--warn)}
.status[data-s="done"]{color:var(--ok)}
.ex{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:700}

.main{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.tabs button{border:0;background:transparent;padding:8px 12px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;font-family:var(--f-display);font-size:.95rem}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.view{flex:1;min-height:0;overflow:auto}
#view-cal{display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.toolbar .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tools button[data-tool="ab"][aria-pressed="true"],.tools button[data-tool="vac"][aria-pressed="true"],.tools button[data-tool="pfmp"][aria-pressed="true"],.tools button[data-tool="exam"][aria-pressed="true"]{background:var(--hl);color:#15201E}
.placing{display:flex;align-items:center;gap:10px;background:var(--hl-soft);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.88rem}
.placing b{flex:1;min-width:0}

.gridwrap{flex:1;overflow:auto;padding:0 16px 120px;overscroll-behavior:contain}
.wgrid{display:grid;grid-template-columns:132px repeat(var(--nc),minmax(220px,1fr));min-width:min-content}
.ghead{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 8px 8px;border-bottom:2px solid var(--ink);font-family:var(--f-display);font-weight:700;display:flex;flex-direction:column;gap:2px}
.ghead small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.75rem}
.ghead .dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cc);margin-right:6px}
.wmeta{padding:8px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.wmeta .d{font-weight:700;font-size:.86rem}
.wmeta .sub{font-size:.72rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ab{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:.8rem;border:1.5px solid var(--ink)}
.ab.B{background:var(--ink);color:var(--surface)}
.wmeta.now{background:var(--hl-soft)}
.wmeta.now{box-shadow:inset 5px 0 0 var(--hl)}
.nowlbl{font-weight:700;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em}
.wnote{font-size:.72rem;color:var(--ink);background:var(--surface-2);border-radius:4px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px;min-height:66px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:background .12s}
.cell:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.cell .cap{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted)}
.cell .free{font-size:.74rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:6px 8px;text-align:center}
.cell .bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.cell .bar i{display:block;height:100%;background:var(--cc)}
.cell.full .cap .num{color:var(--ok);font-weight:700}
.cell.over .cap .num{color:var(--danger);font-weight:700}
.cell.over .bar{background:color-mix(in srgb,var(--danger) 30%,var(--surface-2))}
.cell.off{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);cursor:default}
.cell .offlbl{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cell.pfmp .offlbl{color:var(--cc)}
.cell.drop-ok{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.cell.drop-dim{opacity:.45}
body.placing-mode .cell:not(.off):not(.drop-dim){box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent)}
.chip{display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:6px;font-size:.8rem;background:color-mix(in srgb,var(--b) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--b) 40%,transparent);cursor:grab;user-select:none;-webkit-user-select:none;min-width:0;-webkit-touch-callout:none}
.chip .ct{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:color-mix(in srgb,var(--b) 55%,var(--ink))}
.chip .ch{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.chip.done .ct{text-decoration:line-through;text-decoration-thickness:1px}
.chip .ok{color:var(--ok);font-weight:700}
.chip.lift{opacity:.35}
.vband{grid-column:1/-1;padding:7px 10px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--hatch) 0 8px,transparent 8px 16px);font-size:.8rem;color:var(--muted);display:flex;gap:10px;align-items:center;cursor:pointer}
.vband b{color:var(--ink);font-family:var(--f-display)}
.dragghost{position:fixed;z-index:100;pointer-events:none;padding:7px 12px;border-radius:8px;background:var(--ink);color:var(--surface);font-weight:700;font-size:.85rem;box-shadow:var(--shadow);transform:translate(-50%,-130%);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.drawer{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;flex:1;font-family:var(--f-display);font-size:1.05rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{overflow:auto;padding:14px 16px 100px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);min-width:0}
textarea.inp{min-height:76px;resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sect{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.sect h4{margin:0;font-family:var(--f-display);font-size:.98rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect h4 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.78rem}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.li .x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:2px 6px}
.li a,.linkbtn{color:var(--accent);word-break:break-word}
.linkbtn{border:0;background:transparent;padding:0;text-align:left;text-decoration:underline;font:inherit}
.seance{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.seance .sh{display:grid;grid-template-columns:auto 1fr 70px auto;gap:6px;align-items:center}
.comps{display:flex;flex-direction:column;gap:4px}
.comp{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;padding:4px 2px}
.comp input{margin-top:3px;accent-color:var(--accent)}
.comp .cid{font-family:var(--f-mono);font-size:.76rem;color:var(--b);min-width:46px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.levels button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:1px}
.levels button b{font-family:var(--f-display);font-size:1rem}
.levels button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:30px;height:30px;font-size:1.05rem}
.stepper span{min-width:44px;text-align:center}
.hint{font-size:.8rem;color:var(--muted)}
.note{font-size:.82rem;padding:8px 10px;border-radius:8px;background:var(--hl-soft);color:var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:4px}
.slot{font-size:.74rem;padding:2px 6px;border-radius:5px;background:var(--surface-2)}
.slot.nc{opacity:.55;text-decoration:line-through}

.pad{padding:16px 16px 120px;display:flex;flex-direction:column;gap:20px;max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-family:var(--f-display);font-size:1.15rem;text-wrap:balance}
.panel h3 small{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.kpi b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.76rem;color:var(--muted)}
.scroll-x{overflow-x:auto;min-width:0}
table.mx{border-collapse:collapse;font-size:.8rem;min-width:620px;width:100%}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.mx th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.mx td.c{text-align:center}
table.mx tr.blocrow td{background:var(--surface-2);font-weight:700;font-family:var(--f-display)}
.pass{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:.7rem;font-weight:800;margin:1px;color:#fff;background:var(--b)}
.pass.l1{opacity:.55}.pass.l2{opacity:.8}
.cnt{font-family:var(--f-mono);font-weight:700}
.cnt.z{color:var(--danger)}.cnt.o{color:var(--warn)}.cnt.g{color:var(--ok)}
.hbar{display:grid;grid-template-columns:160px 1fr 70px;gap:10px;align-items:center;font-size:.84rem}
.hbar .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--b)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.slotrow{display:grid;grid-template-columns:72px 70px 64px 74px 1fr auto auto;gap:6px;align-items:center;font-size:.84rem}
.slotrow .inp{padding:5px 6px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted)}
.bnav{display:none}
.tray{display:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow);z-index:200;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,15,14,.5);z-index:150;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:14px;padding:18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);max-height:90%;overflow:auto}
.mbox h3{margin:0;font-family:var(--f-display)}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.88rem}
.exbanner{display:flex;gap:8px;align-items:center;font-size:.8rem;padding:8px 10px;border-radius:8px;background:var(--hl-soft)}

@media (max-width: 860px){
  #app{grid-template-rows:auto 1fr auto auto}
  .top{padding:8px 16px}
  .brand small{display:none}
  .layout,.layout.drawer-open{grid-template-columns:minmax(0,1fr)}
  .side,.main{grid-column:1;grid-row:1;border:0}
  body:not([data-m="seq"]) .side{display:none}
  body[data-m="seq"] .main{display:none}
  .tabs{display:none}
  .drawer{position:fixed;inset:0;z-index:120;border:0;padding-top:env(safe-area-inset-top,0px)}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:transparent;padding:9px 2px 8px;font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-selected="true"]{color:var(--accent)}
  body[data-m="cal"] .tray{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-top:1px solid var(--line);background:var(--surface);overscroll-behavior-x:contain}
  .tray .card{flex:0 0 190px;touch-action:pan-x;padding:8px 9px}

<script>
(function(){
"use strict";
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["Lun","Mar","Mer","Jeu","Ven"];
const fd=d=>d.getDate()+" "+MOIS[d.getMonth()];
const fh=h=>(Math.round(h*10)/10).toString().replace(".",",")+" h";
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const mobile=()=>window.matchMedia("(max-width: 860px)").matches;
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- état par défaut ---------- */
const LEVELS={1:"Découverte",2:"Approfondissement",3:"Maîtrise"};
const STATUS={todo:"À préparer",ready:"Prête",doing:"En cours",done:"Terminée"};
const SLOTTYPES=["Ens. pro","Projet","Co-intervention","Soutien / AP"];
function S(day,start,h,group,type,count){return {id:uid(),day,start,h,group,type,count:count!==false}}
function defaultState(){
  const st={
    v:1, updatedAt:0,
    settings:{year:"2026-2027",start:"2026-08-31",end:"2027-07-02",autoSpread:true},
    classes:[
      {id:"P",code:"1MCVB2",name:"1re MCV B",color:"c1",slots:{
        A:[S(0,"13:50",2,"G2","Ens. pro"),S(0,"16:00",2,"G1","Ens. pro"),S(1,"10:30",1,"CE","Co-intervention"),S(2,"14:50",1,"CE","Ens. pro"),S(3,"08:20",2,"G2","Ens. pro"),S(3,"10:30",2,"G1","Ens. pro")],
        B:[S(0,"13:50",2,"G2","Ens. pro"),S(0,"16:00",2,"G1","Ens. pro"),S(2,"14:50",1,"CE","Ens. pro"),S(3,"08:20",2,"G2","Ens. pro"),S(3,"10:30",2,"G1","Ens. pro")]}},
      {id:"T",code:"TMCVB2",name:"Terminale MCV B",color:"c2",slots:{
        A:[S(0,"08:20",2,"G2","Ens. pro"),S(0,"10:30",2,"G1","Ens. pro"),S(1,"08:20",2,"CE","Projet"),S(1,"13:50",1,"CE","Ens. pro"),S(1,"17:00",1,"CE","Soutien / AP",false),S(2,"08:20",1,"G2","Ens. pro"),S(2,"09:20",1,"G1","Ens. pro"),S(2,"10:30",1,"CE","Soutien / AP",false),S(2,"11:30",1,"CE","Projet"),S(2,"13:50",1,"CE","Ens. pro"),S(2,"16:00",1,"CE","Soutien / AP",false)],
        B:[S(0,"08:20",2,"G2","Ens. pro"),S(0,"10:30",2,"G1","Ens. pro"),S(1,"08:20",2,"CE","Projet"),S(1,"10:30",1,"CE","Ens. pro"),S(1,"13:50",1,"CE","Ens. pro"),S(2,"08:20",1,"G2","Ens. pro"),S(2,"09:20",1,"G1","Ens. pro"),S(2,"10:30",1,"CE","Soutien / AP",false),S(2,"13:50",1,"CE","Ens. pro")]}}
    ],
    holidays:[{date:"2026-08-31",label:"Avant la rentrée"},{date:"2026-11-11",label:"Armistice"},{date:"2027-03-29",label:"Lundi de Pâques"},{date:"2027-05-06",label:"Ascension"},{date:"2027-05-07",label:"Pont de l'Ascension"},{date:"2027-05-17",label:"Lundi de Pentecôte"}],
    blocs:[
      {id:"1",short:"B1",label:"Conseiller et vendre",color:"b1"},
      {id:"2",short:"B2",label:"Suivre les ventes",color:"b2"},
      {id:"3",short:"B3",label:"Fidéliser la clientèle et développer la relation client",color:"b3"},
      {id:"4B",short:"B4B",label:"Prospecter et valoriser l'offre commerciale",color:"b4"},
      {id:"T",short:"TR",label:"Transversal (projet, co-intervention, AP)",color:"bT"}],
    comps:[
      {id:"C1.1",bloc:"1",label:"Assurer la veille commerciale"},
      {id:"C1.2",bloc:"1",label:"Réaliser la vente dans un cadre omnicanal"},
      {id:"C1.3",bloc:"1",label:"Assurer l'exécution de la vente"},
      {id:"C2.1",bloc:"2",label:"Assurer le suivi de la commande du produit et/ou du service"},
      {id:"C2.2",bloc:"2",label:"Traiter les retours et les réclamations du client"},
      {id:"C2.3",bloc:"2",label:"S'assurer de la satisfaction du client"},
      {id:"C3.1",bloc:"3",label:"Traiter et exploiter l'information ou le contact client"},
      {id:"C3.2",bloc:"3",label:"Contribuer à des actions de fidélisation et de développement de la relation client"},
      {id:"C3.3",bloc:"3",label:"Évaluer les actions de fidélisation et de développement de la relation client"},
      {id:"C4B.1",bloc:"4B",label:"Rechercher et analyser les informations à des fins d'exploitation"},
      {id:"C4B.2",bloc:"4B",label:"Participer à l'élaboration d'une démarche de prospection"},
      {id:"C4B.3",bloc:"4B",label:"Mettre en œuvre une démarche de prospection"},
      {id:"C4B.4",bloc:"4B",label:"Analyser les performances de la prospection"},
      {id:"C4B.5",bloc:"4B",label:"Valoriser les produits et/ou les services"}],
    weeks:[], seqs:[], placements:[]
  };
  buildWeeks(st);
  const vacs={"2026-10-19":"Toussaint","2026-10-26":"Toussaint","2026-12-21":"Noël","2026-12-28":"Noël","2027-02-08":"Hiver","2027-02-15":"Hiver","2027-04-05":"Printemps","2027-04-12":"Printemps"};
  st.weeks.forEach(w=>{if(vacs[w.mon])w.vac=vacs[w.mon]});
  recalcAB(st,0,"A");
  // séquences d'exemple (clairement marquées)
  const mk=(classId,title,bloc,hours,level,comps,status,extra)=>Object.assign({id:uid(),classId,title,bloc,hours,level,comps,status,example:true,context:"",objectives:"",seances:[],links:[],files:[],eval:{type:"Formative",date:"",notes:""},notes:"",parent:null,order:0},extra||{});
  const a=mk("P","Accueillir le client et découvrir son besoin","1",10,1,["C1.2"],"done",{context:"Magasin pédagogique : rayon prêt-à-porter",objectives:"Accueillir, questionner, reformuler le besoin.",seances:[{id:uid(),title:"Les étapes de la vente",h:2,content:"",done:true},{id:uid(),title:"Jeux de rôle : la découverte",h:3,content:"",done:true}]});
  const b=mk("P","Suivre une commande en omnicanal","2",8,1,["C2.1","C2.2"],"ready");
  const c=mk("T","Préparer une action de prospection","4B",12,2,["C4B.1","C4B.2"],"doing",{context:"Salon local des artisans"});
  const d=mk("T","Programme de fidélité : analyser et proposer","3",8,2,["C3.2","C3.3"],"todo");
  st.seqs=[a,b,c,d]; st.seqs.forEach((s,i)=>s.order=i);
  return st;
}
function buildWeeks(st){
  const start=parse(st.settings.start), end=parse(st.settings.end);
  let m=addD(start,-((start.getDay()+6)%7)); st.settings.start=iso(m);
  const old={}; (st.weeks||[]).forEach(w=>old[w.mon]=w);
  const out=[];
  while(m<=end && out.length<60){const k=iso(m);out.push(old[k]||{mon:k,ab:"A",vac:"",st:{},note:""});m=addD(m,7)}
  st.weeks=out;
}
function recalcAB(st,from,first){
  let cur=first;
  for(let i=from;i<st.weeks.length;i++){const w=st.weeks[i]; if(w.vac)continue; w.ab=cur; cur=cur==="A"?"B":"A"}
}

/* ---------- état, persistance locale, annulation ---------- */
const LS="progMCV.v1";
let state;
try{const raw=localStorage.getItem(LS); state=raw?JSON.parse(raw):null}catch(e){state=null}
if(!state||!state.weeks){state=defaultState()}
migrate(state);
function migrate(st){
  st.settings=Object.assign({autoSpread:true},st.settings||{});
  ["seqs","placements","holidays","comps","blocs","classes","weeks"].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});
  st.seqs.forEach(s=>{s.seances=s.seances||[];s.links=s.links||[];s.files=s.files||[];s.comps=s.comps||[];s.eval=s.eval||{type:"",date:"",notes:""}});
  st.weeks.forEach(w=>{w.st=w.st||{}});
}
const undoStack=[];
function pushUndo(){undoStack.push(JSON.stringify(state)); if(undoStack.length>40)undoStack.shift(); $("#undoBtn").disabled=false}
function undo(){const s=undoStack.pop(); if(!s)return; state=JSON.parse(s); $("#undoBtn").disabled=!undoStack.length; markAll(); save(); renderAll(); toast("Action annulée")}
let dirty=new Set(), dirtyAll=false;
function markAll(){dirtyAll=true}
function save(keys){
  state.updatedAt=Date.now();
  (keys||["meta"]).forEach(k=>dirty.add(k));
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  scheduleCloud();
}
const changed=(...ks)=>{save(ks.length?ks:["meta"]);renderLight()};

/* ---------- calculs ---------- */
const cls=id=>state.classes.find(c=>c.id===id);
const seqById=id=>state.seqs.find(s=>s.id===id);
const bloc=id=>state.blocs.find(b=>b.id===id)||{short:"?",label:"",color:"bT"};
const bcol=id=>"var(--"+bloc(id).color+")";
const ccol=c=>"var(--"+(c?c.color:"c1")+")";
function weekDates(i){const m=parse(state.weeks[i].mon);return {mon:m,fri:addD(m,4)}}
function holidayDays(i){const {mon}=weekDates(i);const set={};state.holidays.forEach(h=>{const d=parse(h.date);const diff=Math.round((d-mon)/864e5);if(diff>=0&&diff<5)set[diff]=h.label});return set}
function slotHours(slots,skip){let ce=0,g1=0,g2=0;slots.forEach(s=>{if(!s.count||(skip&&skip[s.day]!==undefined))return;const h=+s.h||0;if(s.group==="G1")g1+=h;else if(s.group==="G2")g2+=h;else ce+=h});return ce+Math.max(g1,g2)}
function wStatus(i,cid){const w=state.weeks[i];if(w.vac)return "vac";return w.st[cid]||"cours"}
function capacity(i,cid){if(wStatus(i,cid)!=="cours")return 0;const c=cls(cid);return slotHours(c.slots[state.weeks[i].ab]||[],holidayDays(i))}
function used(i,cid){let h=0;state.placements.forEach(p=>{if(p.week===i){const s=seqById(p.seqId);if(s&&s.classId===cid)h+=p.hours}});return h}
function placedH(seqId){return state.placements.filter(p=>p.seqId===seqId).reduce((a,p)=>a+p.hours,0)}
function doneH(seqId){return state.placements.filter(p=>p.seqId===seqId&&p.done).reduce((a,p)=>a+p.hours,0)}
function schoolIndex(){const m={};let n=0;state.weeks.forEach((w,i)=>{if(!w.vac){n++;m[i]=n}});return {map:m,total:n}}
function currentWeek(){const t=new Date();t.setHours(0,0,0,0);for(let i=0;i<state.weeks.length;i++){const {mon}=weekDates(i);if(t>=mon&&t<addD(mon,7))return i}return -1}
function periods(){const out=[];let cur=null;state.weeks.forEach((w,i)=>{if(w.vac){if(cur){cur.end=w.vac;out.push(cur);cur=null}}else{if(!cur)cur={weeks:[],end:""};cur.weeks.push(i)}});if(cur){cur.end="Été";out.push(cur)}out.forEach((p,k)=>{p.name="P"+(k+1);p.label=fd(weekDates(p.weeks[0]).mon)+" → "+fd(weekDates(p.weeks[p.weeks.length-1]).fri)});return out}

/* ---------- interface : état d'affichage ---------- */
const ui={view:"cal",m:"cal",classView:"both",sideFilter:"all",tool:"place",placing:null,drawer:null,q:""};
try{const u=JSON.parse(localStorage.getItem(LS+".ui")||"{}");Object.assign(ui,{classView:u.classView||"both",sideFilter:u.sideFilter||"all"})}catch(e){}
function saveUi(){try{localStorage.setItem(LS+".ui",JSON.stringify({classView:ui.classView,sideFilter:ui.sideFilter}))}catch(e){}}
function visibleClasses(){if(mobile()){if(ui.classView==="both")ui.classView=state.classes[0].id;return state.classes.filter(c=>c.id===ui.classView)}return ui.classView==="both"?state.classes:state.classes.filter(c=>c.id===ui.classView)}

let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200)}
function modal(html,bind){const m=$("#modal");$("#mbox").innerHTML=html;m.hidden=false;const close=()=>{m.hidden=true;$("#mbox").innerHTML=""};m.onclick=e=>{if(e.target===m)close()};bind&&bind(close);return close}
function confirmBox(title,text,okLabel,onOk,danger){modal(`<h3>${esc(title)}</h3><p style="margin:0">${esc(text)}</p><div class="acts"><button class="btn ghost" data-x>Annuler</button><button class="btn ${danger?"danger":""}" data-ok>${esc(okLabel)}</button></div>`,close=>{$("#mbox [data-x]").onclick=close;$("#mbox [data-ok]").onclick=()=>{close();onOk()}})}

/* ---------- rendu : liste des séquences ---------- */
function seqCardHTML(s,compact){
  const c=cls(s.classId), p=placedH(s.id), pct=s.hours?Math.min(100,p/s.hours*100):0;
  return `<div class="card ${ui.placing===s.id?"sel":""}" data-seq="${s.id}" style="--b:${bcol(s.bloc)}">
    <div class="t">${esc(s.title||"Sans titre")}</div><div class="hours">${fh(p).replace(" h","")}/${fh(s.hours)}</div>
    <div class="meta"><span class="tag">${esc(bloc(s.bloc).short)}</span><span class="cls" style="color:${ccol(c)}">${esc(c?c.code:"?")}</span><span class="lvl" title="Niveau ${s.level} · ${LEVELS[s.level]}">${"●".repeat(s.level)}${"○".repeat(3-s.level)}</span>${compact?"":`<span class="status" data-s="${s.status}">${STATUS[s.status]||""}</span>`}${s.example?'<span class="ex">exemple</span>':""}${s.review?'<span class="ex">à relire</span>':""}</div>
    <div class="prog"><i style="width:${pct}%"></i></div></div>`;
}
function filteredSeqs(filter){const q=ui.q.trim().toLowerCase();return state.seqs.slice().sort((a,b)=>(a.order??0)-(b.order??0)).filter(s=>(filter==="all"||s.classId===filter)&&(!q||(s.title+" "+s.comps.join(" ")+" "+bloc(s.bloc).label+" "+(s.context||"")).toLowerCase().includes(q)))}
function renderSide(){
  $("#sideFilter").innerHTML=[["all","Toutes"],...state.classes.map(c=>[c.id,c.code])].map(([v,l])=>`<button data-f="${v}" aria-pressed="${ui.sideFilter===v}">${esc(l)}</button>`).join("");
  const list=filteredSeqs(ui.sideFilter);
  $("#seqCount").textContent=list.length+" / "+state.seqs.length;
  const ex=state.seqs.some(s=>s.example)?`<div class="exbanner"><span style="flex:1">Les séquences « exemple » montrent le fonctionnement.</span><button class="ibtn" id="clearEx">Les effacer</button></div>`:"";
  $("#seqList").innerHTML=ex+(list.length?list.map(s=>seqCardHTML(s)).join(""):`<div class="empty">Aucune séquence${ui.q?" pour cette recherche":""}.<br>Crée ta première séquence avec « + Nouvelle ».</div>`)
    +(list.length&&!mobile()?`<p class="hint" style="margin:6px 4px">Glisse une carte sur une semaine pour la planifier. Les heures s'étalent automatiquement sur les semaines suivantes.</p>`:"");
}
function renderTray(){
  if(!mobile()){$("#tray").innerHTML="";return}
  const cid=visibleClasses()[0].id;
  const list=filteredSeqs(cid);
  $("#tray").innerHTML=list.length?list.map(s=>seqCardHTML(s,true)).join(""):`<div class="hint" style="padding:6px 0">Aucune séquence pour cette classe : crée-la dans l'onglet Séquences.</div>`;
}

/* ---------- rendu : grille ---------- */
function renderGrid(){
  const vc=visibleClasses(), si=schoolIndex(), now=currentWeek();
  $("#classFilter").innerHTML=(mobile()?[]:[["both","Les deux"]]).concat(state.classes.map(c=>[c.id,c.code])).map(([v,l])=>`<button data-cv="${v}" aria-pressed="${ui.classView===v}">${esc(l)}</button>`).join("");
  document.querySelectorAll("#tools button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tool===ui.tool));
  const g=$("#wgrid"); g.style.setProperty("--nc",vc.length);
  let h=`<div class="ghead">Semaine<small>${si.total} sem. de cours</small></div>`;
  vc.forEach(c=>{let cap=0,u=0;state.weeks.forEach((w,i)=>{cap+=capacity(i,c.id);u+=used(i,c.id)});

    const {mon,fri}=weekDates(i), hol=holidayDays(i), holTxt=Object.values(hol).join(", ");
    h+=`<div class="wmeta ${i===now?"now":""}" data-row="${i}" ${i===now?'id="nowRow"':""}>${i===now?'<span class="nowlbl">Cette semaine</span>':""}

      <span class="sub"><span class="ab ${w.ab}" title="Semaine ${w.ab}">${w.ab}</span><span class="num">S${isoWeek(mon)}</span><span>n°${si.map[i]}</span></span>
      ${holTxt?`<span class="wnote" title="${esc(holTxt)}">⦸ ${esc(holTxt)}</span>`:""}${w.note?`<span class="wnote" title="${esc(w.note)}">${esc(w.note)}</span>`:""}</div>`;
    vc.forEach(c=>{
      const st=wStatus(i,c.id), cap=capacity(i,c.id), u=used(i,c.id);
      if(st!=="cours"){h+=`<div class="cell off ${st}" data-drop data-week="${i}" data-class="${c.id}" style="--cc:${ccol(c)}"><span class="offlbl">${st==="pfmp"?"PFMP":st==="exam"?"Examens":"Pas de cours"}</span></div>`;return}

/* ---------- placement ---------- */
function placeSeq(seqId,week,silent){
  const s=seqById(seqId); if(!s)return;
  if(wStatus(week,s.classId)!=="cours"){toast("Pas de cours cette semaine pour cette classe.");return}
  let rest=Math.round((s.hours-placedH(s.id))*10)/10;
  if(rest<=0){toast(`« ${s.title} » est déjà planifiée en entier. Augmente sa durée ou crée le niveau suivant de la spirale.`);return}
  pushUndo();
  const done=[];
  const add=(w,h)=>{const ex=state.placements.find(p=>p.seqId===s.id&&p.week===w);if(ex)ex.hours+=h;else state.placements.push({id:uid(),seqId:s.id,week:w,hours:h,done:false});done.push([w,h])};
  if(!state.settings.autoSpread){add(week,rest);rest=0}
  else{for(let w=week;w<state.weeks.length&&rest>0;w++){const cap=capacity(w,s.classId);if(!cap)continue;const free=Math.max(0,cap-used(w,s.classId));const take=Math.min(free,rest);if(take>0){add(w,take);rest=Math.round((rest-take)*10)/10}}}
  if(!done.length){add(week,rest);rest=0}
  const si=schoolIndex();
  changed("meta");
  if(!silent)toast(`« ${s.title} » : `+done.map(([w,h])=>`n°${si.map[w]} (${fh(h)})`).join(", ")+(rest>0?` · ${fh(rest)} sans place avant la fin de l'année`:""));
}
function movePl(pid,week){
  const p=state.placements.find(x=>x.id===pid);if(!p||p.week===week)return;const s=seqById(p.seqId);
  if(wStatus(week,s.classId)!=="cours"){toast("Pas de cours cette semaine pour cette classe.");return}
  pushUndo();const ex=state.placements.find(x=>x.seqId===p.seqId&&x.week===week&&x.id!==p.id);
  if(ex){ex.hours+=p.hours;state.placements=state.placements.filter(x=>x!==p)}else p.week=week;
  changed("meta");const u=used(week,s.classId),c=capacity(week,s.classId);if(u>c)toast(`Semaine surchargée : ${fh(u)} pour ${fh(c)} disponibles.`);
}

/* ---------- glisser-déposer (souris + tactile) ---------- */
let pend=null,lastDragEnd=0,autoRAF=0;
function dragPrepare(e,payload,label,mode){
  if(e.button!==undefined&&e.button!==0)return;
  pend={x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,payload,label,mode,started:false,touch:e.pointerType!=="mouse",src:e.currentTarget||e.target,lp:null};
  if(pend.touch&&mode==="long"){pend.lp=setTimeout(()=>{if(pend&&!pend.started)startDrag()},380)}
  window.addEventListener("pointermove",onPMove,{passive:false});
  window.addEventListener("pointerup",onPUp);
  window.addEventListener("pointercancel",onPCancel);
}
function startDrag(){
  pend.started=true;clearTimeout(pend.lp);
  const gh=document.createElement("div");gh.className="dragghost";gh.textContent=pend.label;document.body.appendChild(gh);pend.ghost=gh;moveGhost();
  if(pend.payload.kind==="pl"){const el=document.querySelector(`[data-pl="${pend.payload.id}"]`);el&&el.classList.add("lift")}
  const cid=pend.payload.kind==="seq"?seqById(pend.payload.id)?.classId:seqById(state.placements.find(p=>p.id===pend.payload.id)?.seqId)?.classId;
  pend.cid=cid;
  document.querySelectorAll(".cell").forEach(c=>{if(c.dataset.class!==cid||c.classList.contains("off"))c.classList.add("drop-dim")});
  if(mobile()&&ui.m!=="cal")setMobile("cal");
  autoScroll();
}
function moveGhost(){if(pend&&pend.ghost){pend.ghost.style.left=pend.cx+"px";pend.ghost.style.top=pend.cy+"px"}}
function targetAt(x,y){const el=document.elementFromPoint(x,y);const c=el&&el.closest(".cell[data-drop]");return c&&!c.classList.contains("drop-dim")?c:null}
function onPMove(e){
  if(!pend)return;pend.cx=e.clientX;pend.cy=e.clientY;
  const dx=e.clientX-pend.x,dy=e.clientY-pend.y,dist=Math.hypot(dx,dy);
  if(!pend.started){
    if(pend.mode==="long"&&pend.touch){if(dist>10)cleanup();return}
    if(pend.mode==="up"){if(pend.touch){if(dist>10){if(-dy>Math.abs(dx)*1.2)startDrag();else cleanup()}return}}
    if(dist>6)startDrag();else return;
  }
  e.preventDefault();moveGhost();
  document.querySelectorAll(".cell.drop-ok").forEach(c=>c.classList.remove("drop-ok"));
  const t=targetAt(e.clientX,e.clientY);if(t)t.classList.add("drop-ok");
}
function onPUp(e){
  if(pend&&pend.started){const t=targetAt(e.clientX,e.clientY);const p=pend.payload;lastDragEnd=Date.now();cleanup();
    if(t){const w=+t.dataset.week;if(p.kind==="seq")placeSeq(p.id,w);else movePl(p.id,w)}else renderGrid()}
  else cleanup();
}
function onPCancel(){if(pend&&pend.started){lastDragEnd=Date.now();cleanup();renderGrid()}else cleanup()}
function cleanup(){
  if(!pend)return;clearTimeout(pend.lp);pend.ghost&&pend.ghost.remove();cancelAnimationFrame(autoRAF);
  document.querySelectorAll(".drop-ok,.drop-dim,.lift").forEach(c=>c.classList.remove("drop-ok","drop-dim","lift"));
  pend=null;window.removeEventListener("pointermove",onPMove);window.removeEventListener("pointerup",onPUp);window.removeEventListener("pointercancel",onPCancel);
}
document.addEventListener("touchmove",e=>{if(pend&&pend.started)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(pend)e.preventDefault()});
function autoScroll(){
  if(!pend||!pend.started)return;const wrap=$("#gridwrap");const r=wrap.getBoundingClientRect();const y=pend.cy;const edge=70;
  let v=0;if(y<r.top+edge)v=-Math.ceil((r.top+edge-y)/5);else if(y>r.bottom-edge)v=Math.ceil((y-(r.bottom-edge))/5);
  if(v){wrap.scrollTop+=v;document.querySelectorAll(".cell.drop-ok").forEach(c=>c.classList.remove("drop-ok"));const t=targetAt(pend.cx,pend.cy);if(t)t.classList.add("drop-ok")}
  autoRAF=requestAnimationFrame(autoScroll);
}

const blobCache={};

function fileText(f){try{const b=atob(f.data.split(",")[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder("utf-8").decode(u)}catch(e){return ""}}
function copyText(t,okMsg){const fb=()=>modal(`<h3>Copie le texte</h3><textarea class="inp" id="cpt" style="min-height:240px;font-size:.8rem">${esc(t)}</textarea><div class="acts"><button class="btn" data-x>Fermer</button></div>`,close=>{const ta=$("#cpt");ta.focus();ta.select();$("#mbox [data-x]").onclick=close});

function fileUrl(f){if(f.assetId)return "/_blob/"+f.assetId;if(f.data){if(!blobCache[f.id]){try{const [h,b]=f.data.split(",");const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);blobCache[f.id]=URL.createObjectURL(new Blob([arr],{type:(h.match(/data:([^;]+)/)||[])[1]||"application/octet-stream"}))}catch(e){return "#"}}return blobCache[f.id]}return "#"}

    const pls=state.placements.filter(p=>p.week===i&&seqById(p.seqId)?.classId===c.id);

    h+=`<div class="sect" style="--cc:${ccol(c)}"><h4><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cc);margin-right:6px"></span>${esc(c.name)}</span><small class="num">${fh(u)} / ${fh(cap)}</small></h4>

      ${st==="cours"?`<div class="slots">${(c.slots[w.ab]||[]).slice().sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start)).map(s=>`<span class="slot ${!s.count||hol[s.day]!==undefined?"nc":""}">${JOURS[s.day]} ${s.start.replace(":","h")} · ${fh(s.h)} · ${s.group==="CE"?"classe":s.group} · ${esc(s.type)}</span>`).join("")}</div>
      ${pls.map(p=>{const s=seqById(p.seqId);return `<div class="li" style="--b:${bcol(s.bloc)};grid-template-columns:auto 1fr auto"><input type="checkbox" data-pdone="${p.id}" ${p.done?"checked":""} aria-label="Fait" title="Fait"><a href="#" data-open="${s.id}" style="color:var(--ink);font-weight:700;text-decoration:none"><span class="tag">${esc(bloc(s.bloc).short)}</span> ${esc(s.title)}</a>
        <span style="display:flex;gap:6px;align-items:center"><span class="stepper"><button data-ph="${p.id}" data-d="-0.5" aria-label="Moins">−</button><span class="num">${fh(p.hours)}</span><button data-ph="${p.id}" data-d="0.5" aria-label="Plus">+</button></span><button class="x" data-pdel="${p.id}" aria-label="Retirer">✕</button></span></div>`}).join("")||'<span class="hint">Rien de planifié.</span>'}
      ${avail.length?`<div style="display:flex;gap:6px"><select class="inp" data-addsel="${c.id}"><option value="">Ajouter une séquence…</option>${avail.map(s=>`<option value="${s.id}">${esc(s.title)} (reste ${fh(Math.max(0,s.hours-placedH(s.id)))})</option>`).join("")}</select><button class="btn sm" data-addbtn="${c.id}">Ajouter</button></div>`:""}`:""}
    </div>`;
  });
  $("#dBody").innerHTML=h;
}

/* ---------- suivi ---------- */
function renderStats(){
  const per=periods();
  let h=`<div class="pad">`;
  state.classes.forEach(c=>{
    let cap=0,u=0,d=0;state.weeks.forEach((w,i)=>{cap+=capacity(i,c.id);u+=used(i,c.id)});
    const seqs=state.seqs.filter(s=>s.classId===c.id);
    seqs.forEach(s=>d+=doneH(s.id));
    const unplanned=seqs.filter(s=>placedH(s.id)<s.hours-0.01);
    const noEval=seqs.filter(s=>!s.eval||!s.eval.type);
    const pfmp=state.weeks.filter(w=>!w.vac&&w.st[c.id]==="pfmp").length;
    h+=`<div class="panel" style="--cc:${ccol(c)}"><h3>${esc(c.name)}<small>${esc(c.code)}</small></h3>
      <div class="kpis"><div class="kpi"><b class="num">${fh(u)}</b><span>planifiées sur ${fh(cap)} disponibles</span></div>
      <div class="kpi"><b class="num">${fh(d)}</b><span>déjà réalisées (cochées « fait »)</span></div>
      <div class="kpi"><b class="num">${seqs.length}</b><span>séquences · ${unplanned.length} à finir de planifier</span></div>
      <div class="kpi"><b class="num">${pfmp}</b><span>semaine(s) de PFMP marquée(s)</span></div></div>
      ${unplanned.length?`<div class="hint">À planifier : ${unplanned.map(s=>`<a href="#" data-open="${s.id}" style="color:var(--accent)">${esc(s.title)}</a> (${fh(s.hours-placedH(s.id))})`).join(" · ")}</div>`:""}
      ${noEval.length?`<div class="hint">Sans évaluation prévue : ${noEval.map(s=>`<a href="#" data-open="${s.id}" style="color:var(--accent)">${esc(s.title)}</a>`).join(" · ")}</div>`:""}
      <div class="lab">Heures planifiées par bloc</div>
      ${state.blocs.map(b=>{const hb=state.placements.filter(p=>{const s=seqById(p.seqId);return s&&s.classId===c.id&&s.bloc===b.id}).reduce((a,p)=>a+p.hours,0);return `<div class="hbar" style="--b:${bcol(b.id)}"><span>${esc(b.short)} · ${esc(b.label.split(" ").slice(0,3).join(" "))}</span><span class="tr"><i style="width:${u?hb/u*100:0}%"></i></span><span class="num">${fh(hb)}</span></div>`}).join("")}
      <div class="lab" style="margin-top:6px">Spirale des compétences par période</div>
      <div class="legend"><span><span class="pass l1" style="--b:var(--muted)">1</span> découverte</span><span><span class="pass l2" style="--b:var(--muted)">2</span> approfondissement</span><span><span class="pass" style="--b:var(--muted)">3</span> maîtrise</span><span>Passages : <span class="cnt z">0</span> jamais abordée · <span class="cnt o">1</span> pas encore reprise · <span class="cnt g">2+</span> spiralée</span></div>
      <div class="scroll-x"><table class="mx"><thead><tr><th>Compétence</th>${per.map(p=>`<th class="c" title="${esc(p.label)}">${p.name}<br><span style="text-transform:none;letter-spacing:0;font-weight:400">${esc(p.end==="Été"?"→ été":"→ "+p.end)}</span></th>`).join("")}<th class="c">Passages</th></tr></thead><tbody>
      ${state.blocs.map(b=>{const cs=state.comps.filter(x=>x.bloc===b.id);if(!cs.length)return "";
        return `<tr class="blocrow"><td colspan="${per.length+2}" style="color:${bcol(b.id)}">${esc(b.short)} · ${esc(b.label)}</td></tr>`+cs.map(cp=>{
          let n=0;const cells=per.map(pp=>{const hits=seqs.filter(s=>s.comps.includes(cp.id)&&state.placements.some(pl=>pl.seqId===s.id&&pp.weeks.includes(pl.week)));n+=hits.length;
            return `<td class="c">${hits.map(s=>`<span class="pass l${s.level}" style="--b:${bcol(s.bloc)}" title="${esc(s.title)} · niveau ${s.level}">${s.level}</span>`).join("")}</td>`}).join("");
          return `<tr><td><span class="num" style="color:${bcol(b.id)}">${esc(cp.id)}</span> ${esc(cp.label)}</td>${cells}<td class="c"><span class="cnt ${n===0?"z":n===1?"o":"g"}">${n}</span></td></tr>`}).join("")}).join("")}
      </tbody></table></div></div>`;
  });
  h+=`<p class="hint">Les périodes sont découpées automatiquement par les vacances. Une compétence vue une seule fois n'est pas encore « spiralée » : crée son niveau suivant depuis la fiche séquence.</p></div>`;
  $("#view-stats").innerHTML=h;
}

/* ---------- rendu global ---------- */
function renderLight(){renderSide();renderGrid();renderTray();if(ui.view==="stats")renderStats();if(ui.drawer)renderDrawer()}
function renderAll(){renderSide();renderGrid();renderTray();if(ui.view==="stats")renderStats();if(ui.view==="settings")renderSettings();if(ui.drawer)renderDrawer();$("#subtitle").textContent=state.classes.map(c=>c.code).join(" · ")+" · "+state.settings.year}
function setView(v){ui.view=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));["cal","stats","settings"].forEach(k=>$("#view-"+k).hidden=k!==v);if(v==="stats")renderStats();if(v==="settings")renderSettings()}
function setMobile(m){ui.m=m;document.body.dataset.m=m;document.querySelectorAll("#bnav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===m));if(m!=="seq")setView(m);renderTray()}

/* ---------- actions séquence ---------- */
function newSeq(classId){pushUndo();const s={id:uid(),classId:classId||state.classes[0].id,title:"Nouvelle séquence",bloc:"1",hours:8,level:1,comps:[],status:"todo",context:"",objectives:"",seances:[],links:[],files:[],eval:{type:"",date:"",notes:""},notes:"",parent:null,order:state.seqs.length};state.seqs.push(s);save(["meta",s.id]);renderLight();openDrawer("seq",s.id);setTimeout(()=>{const t=$("#f-title");t&&(t.focus(),t.select())},60)}
function seqDirty(s){save([s.id])}
function delSeq(id){pushUndo();const s=seqById(id);state.seqs=state.seqs.filter(x=>x.id!==id);state.placements=state.placements.filter(p=>p.seqId!==id);state.seqs.forEach(x=>{if(x.parent===id)x.parent=null});cloud.deleted.add(id);save(["meta"]);closeDrawer();renderLight();toast(`« ${s.title} » supprimée. « Annuler » pour la récupérer.`)}

/* ---------- événements ---------- */
$("#undoBtn").onclick=undo;
$("#dataBtn").onclick=()=>{setView("settings")};
$("#dClose").onclick=closeDrawer;
$("#newSeq").onclick=()=>newSeq(ui.sideFilter!=="all"?ui.sideFilter:(ui.classView!=="both"?ui.classView:state.classes[0].id));
$("#q").oninput=e=>{ui.q=e.target.value;renderSide();renderTray()};
$("#todayBtn").onclick=()=>scrollToNow(true);
$("#placingCancel").onclick=()=>{ui.placing=null;renderLight()};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)setView(b.dataset.v)};
$("#bnav").onclick=e=>{const b=e.target.closest("button");if(b)setMobile(b.dataset.m)};
$("#sideFilter").onclick=e=>{const b=e.target.closest("button");if(b){ui.sideFilter=b.dataset.f;saveUi();renderSide()}};
$("#classFilter").onclick=e=>{const b=e.target.closest("button");if(b){ui.classView=b.dataset.cv;saveUi();renderGrid();renderTray()}};
$("#tools").onclick=e=>{const b=e.target.closest("button");if(b){ui.tool=b.dataset.tool;ui.placing=null;renderGrid();const tips={ab:"Touche une semaine pour inverser A ↔ B.",vac:"Touche une semaine pour la marquer en vacances (ou la rétablir).",pfmp:"Touche la case d'une classe pour la passer en PFMP (ou la rétablir).",exam:"Touche la case d'une classe pour la marquer en examens."};if(tips[ui.tool])toast(tips[ui.tool])}};

function cardDown(e){const c=e.target.closest(".card[data-seq]");if(!c)return;const s=seqById(c.dataset.seq);dragPrepare(e,{kind:"seq",id:s.id},s.title,c.closest("#tray")?"up":(e.pointerType==="mouse"?"move":"long"))}
$("#seqList").addEventListener("pointerdown",cardDown);
$("#tray").addEventListener("pointerdown",cardDown);
$("#seqList").addEventListener("click",e=>{
  if(e.target.id==="clearEx"){confirmBox("Effacer les exemples ?","Les séquences marquées « exemple » et leurs placements seront supprimés.","Effacer",()=>{pushUndo();const ids=state.seqs.filter(s=>s.example).map(s=>s.id);ids.forEach(i=>cloud.deleted.add(i));state.seqs=state.seqs.filter(s=>!s.example);state.placements=state.placements.filter(p=>!ids.includes(p.seqId));if(ui.drawer&&ids.includes(ui.drawer.id))closeDrawer();changed("meta")},true);return}
  if(Date.now()-lastDragEnd<350)return;const c=e.target.closest(".card[data-seq]");if(c)openDrawer("seq",c.dataset.seq)});
$("#tray").addEventListener("click",e=>{if(Date.now()-lastDragEnd<350)return;const c=e.target.closest(".card[data-seq]");if(!c)return;const id=c.dataset.seq;ui.placing=ui.placing===id?null:id;ui.tool="place";renderGrid();renderTray()});

const grid=$("#wgrid");
grid.addEventListener("pointerdown",e=>{const ch=e.target.closest(".chip[data-pl]");if(!ch||ui.tool!=="place")return;const p=state.placements.find(x=>x.id===ch.dataset.pl);const s=seqById(p.seqId);dragPrepare(e,{kind:"pl",id:p.id},s.title,e.pointerType==="mouse"?"move":"long")});
grid.addEventListener("click",e=>{
  if(Date.now()-lastDragEnd<350)return;
  const vb=e.target.closest(".vband");
  if(vb){const a=+vb.dataset.vac,b=+vb.dataset.vacEnd;if(ui.tool==="vac"){pushUndo();for(let k=a;k<=b;k++)state.weeks[k].vac="";recalcAB(state,0,state.weeks.find(w=>!w.vac).ab);changed("meta");toast("Vacances retirées, alternance A/B recalculée.")}else openDrawer("week",a);return}
  const row=e.target.closest("[data-row]"),cell=e.target.closest(".cell[data-drop]");
  const i=row?+row.dataset.row:cell?+cell.dataset.week:null;if(i===null)return;
  if(ui.tool==="ab"){pushUndo();state.weeks[i].ab=state.weeks[i].ab==="A"?"B":"A";changed("meta");return}
  if(ui.tool==="vac"){pushUndo();const lbl=guessVac(i);state.weeks[i].vac=lbl;const moved=state.placements.filter(p=>p.week===i).length;recalcAB(state,0,firstAB());changed("meta");toast(`Semaine marquée « Vacances »${moved?` · ${moved} placement(s) masqué(s), à déplacer`:""}.`);return}
  if((ui.tool==="pfmp"||ui.tool==="exam")&&cell){pushUndo();const c=cell.dataset.class,w=state.weeks[i];w.st[c]=w.st[c]===ui.tool?"cours":ui.tool;changed("meta");return}
  if(ui.placing&&cell){if(cell.dataset.class!==seqById(ui.placing).classId){toast("Cette séquence est prévue pour l'autre classe.");return}placeSeq(ui.placing,i);const s=seqById(ui.placing);if(s&&placedH(s.id)>=s.hours-0.01){ui.placing=null;renderLight()}return}
  openDrawer("week",i);
});
function firstAB(){const w=state.weeks.find(x=>!x.vac);return w?w.ab:"A"}
function guessVac(i){const m=parse(state.weeks[i].mon).getMonth();return m===9||m===10?"Toussaint":m===11||m===0?"Noël":m===1||m===2?"Hiver":m===3||m===4?"Printemps":"Vacances"}

/* tiroir : délégation */
const dBody=$("#dBody");
dBody.addEventListener("input",e=>{
  const t=e.target;if(!ui.drawer)return;
  if(ui.drawer.kind==="seq"){const s=seqById(ui.drawer.id);if(!s)return;
    if(t.dataset.k){let v=t.value;if(t.dataset.k==="hours")v=Math.max(0,parseFloat(String(v).replace(",","."))||0);s[t.dataset.k]=v;delete s.example;if(t.dataset.k==="title")$("#dTitle").textContent=v;seqDirty(s);debRender();return}
    if(t.dataset.ek){s.eval[t.dataset.ek]=t.value;seqDirty(s);return}
    const se=t.closest("[data-se]");if(se&&t.dataset.seK&&t.type!=="checkbox"){const x=s.seances.find(y=>y.id===se.dataset.se);x[t.dataset.seK]=t.dataset.seK==="h"?(parseFloat(t.value)||0):t.value;seqDirty(s);return}
  } else if(t.id==="w-note"){state.weeks[ui.drawer.id].note=t.value;save();debRender()}
});
let dr;function debRender(){clearTimeout(dr);dr=setTimeout(()=>{renderSide();renderGrid();renderTray()},400)}

    if(t.dataset.comp){s.comps=t.checked?[...new Set([...s.comps,t.dataset.comp])]:s.comps.filter(c=>c!==t.dataset.comp);seqDirty(s);renderDrawer();if(ui.view==="stats")renderStats();return}

  } else {
    if(t.dataset.pdone){const p=state.placements.find(x=>x.id===t.dataset.pdone);p.done=t.checked;changed("meta");return}
  }

    const a=t.dataset.act;

const ASSET_OK=/^(image\/|video\/|application\/pdf$|text\/plain$|text\/csv$|text\/markdown$|application\/json$)/;
function guessType(f){if(f.type)return f.type.split(";")[0];const ext=(f.name.split(".").pop()||"").toLowerCase();return {pdf:"application/pdf",txt:"text/plain",csv:"text/csv",md:"text/markdown",json:"application/json",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",mp4:"video/mp4"}[ext]||""}

    } else {

function cleanJsonText(t){t=String(t||"").replace(/^\uFEFF/,"").trim();const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)t=f[1].trim();const i=Math.min(...["{","["].map(c=>{const k=t.indexOf(c);return k<0?1e9:k}));if(i>0&&i<1e9)t=t.slice(i);const j=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));if(j>=0)t=t.slice(0,j+1);return t.replace(/[\u201C\u201D]/g,'"').replace(/,\s*([}\]])/g,"$1")}

      (d.comps||[]).forEach(c=>{if(c&&c.id&&!state.comps.some(x=>x.id===c.id)&&state.blocs.some(b=>b.id===c.bloc))state.comps.push({id:c.id,bloc:c.bloc,label:c.label||c.id})});
      let n=0,first=null;const dropNote=[];

        const byCode=state.classes.find(c=>c.code===s.classCode);s.classId=byCode?byCode.id:(cls(s.classId)?s.classId:state.classes[0].id);delete s.classCode;
        if(!s.id||seqById(s.id))s.id=uid();if(!state.blocs.some(b=>b.id===s.bloc))s.bloc="T";
        const dropped=(s.comps||[]).filter(c=>!state.comps.some(x=>x.id===c));if(dropped.length)dropNote.push(dropped.join(", "));
        s.comps=(s.comps||[]).filter(c=>state.comps.some(x=>x.id===c));s.level=Math.min(3,Math.max(1,+s.level||1));
        s.seances=(Array.isArray(s.seances)?s.seances:[]).map(x=>({id:x.id||uid(),title:String(x.title||""),h:+String(x.h??x.heures??0).replace(",",".")||0,content:String(x.content||x.deroule||""),done:!!x.done}));

    for(const k of keys){
      if(k==="meta")await withRetry(()=>cloud.col.doc("meta").set(metaDoc()));
      else{const s=seqById(k);if(s)await withRetry(()=>cloud.col.doc("seq_"+k).set(JSON.parse(JSON.stringify(s))))}
    }
    for(const id of [...cloud.deleted]){if(!seqById(id)){await withRetry(()=>cloud.col.doc("seq_"+id).delete())}cloud.deleted.delete(id)}
    if(wasAll&&cloud.remoteSeqIds){for(const id of cloud.remoteSeqIds){if(!seqById(id))try{await cloud.col.doc("seq_"+id).delete()}catch(e){}}cloud.remoteSeqIds=null}
    setSync("ok","Synchronisé");
  }catch(e){
    dirtyAll=true;
    if(e&&e.code==="quota_exceeded")setSync("err","Espace plein");else if(e&&(e.code==="revoked"||e.code==="not_granted")){cloud.ready=false;setSync("local","Sur cet appareil")}else setSync("err","Hors ligne");
    if(e&&e.code==="quota_exceeded")toast("Espace de synchronisation plein : exporte en JSON et allège les pièces jointes.");
  }finally{cloud.busy=false;if(cloud.again){cloud.again=false;scheduleCloud()}}
}
async function pull(initial,manual){
  if(!cloud.col)return;
  try{
    setSync("busy","Synchronisation…");
    const snap=await withRetry(()=>cloud.col.get());
    let meta=null;const seqs={};
    snap.docs.forEach(d=>{if(!d.exists)return;if(d.id==="meta")meta=clone(d.data());else if(d.id.startsWith("seq_"))seqs[d.id.slice(4)]=clone(d.data())});
    cloud.remoteSeqIds=Object.keys(seqs);
    if(meta&&(manual||(meta.updatedAt||0)>(state.updatedAt||0))){
      if(dirty.size&&!manual&&!initial){cloud.ready=true;flush();return}
      const order=meta.seqOrder||Object.keys(seqs);delete meta.seqOrder;
      meta.seqs=order.map(id=>seqs[id]).filter(Boolean).concat(Object.keys(seqs).filter(id=>!order.includes(id)).map(id=>seqs[id]));
      migrate(meta);state=meta;try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
      if(ui.drawer&&ui.drawer.kind==="seq"&&!seqById(ui.drawer.id))closeDrawer();
      renderAll();if(ui.view==="settings")renderSettings();
      cloud.ready=true;setSync("ok","Synchronisé");if(manual)toast("Données rechargées depuis ton compte.");
    } else {
      cloud.ready=true;
      if(!meta||(meta.updatedAt||0)<(state.updatedAt||0)){markAll();await flush()}else setSync("ok","Synchronisé");
    }
  }catch(e){setSync("err","Hors ligne");cloud.ready=true}
}
async function initCloud(){
  const c=window.claude;if(!c||typeof c.use!=="function"){setSync("local","Sur cet appareil");return}
  c.use("downloads").then(d=>{cloud.downloads=d}).catch(()=>{});
  c.use("assets").then(a=>{cloud.assets=a;if(ui.drawer)renderDrawer()}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(!db||!user){setSync("local","Sur cet appareil");return}
    const id=await user.id();if(!id){setSync("local","Sur cet appareil");return}
    cloud.db=db;cloud.col=db.collection("data/users/"+id);
    await pull(true);
    if(ui.view==="settings")renderSettings();
  }catch(e){setSync("local","Sur cet appareil")}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cloud.ready&&!cloud.busy&&!dirty.size&&!dirtyAll)pull(false)});

/* ---------- démarrage ---------- */
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{renderGrid();renderTray()},150)});
document.body.dataset.m="cal";
renderAll();setView("cal");setMobile("cal");
requestAnimationFrame(()=>scrollToNow(false));
initCloud();
})();
</script>
